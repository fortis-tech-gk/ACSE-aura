name: Build Android APKs (GitHub runner)

# Builds the sideloadable APKs of BOTH apps on GitHub's runners with `eas build --local`:
# the build runs here, not on Expo's servers, so it uses no EAS build quota. EAS only supplies
# the existing Expo-managed signing key, so these APKs install over the ones handed out before.
#
#   target = production → athletes-preview + officials-preview (production API, meet-day tablets)
#   target = staging    → athletes-demo   + officials-demo    (staging API, rehearsals)
#
# Repository secret needed:
#   EXPO_TOKEN   expo.dev → Account settings → Access tokens (account ganesh_a_k_11)
#
# Run: Actions → "Build Android APKs (GitHub runner)" → Run workflow, or
#   gh workflow run android-apk.yml --repo ganeshak11/vtu-athletics -f target=production
# The APKs are attached to the run as artifacts (kept 30 days).

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which API the apps talk to
        type: choice
        options: [production, staging]
        default: production

jobs:
  apk:
    if: github.repository == 'ganeshak11/vtu-athletics'
    name: ${{ matrix.app }} APK (${{ inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        app: [officials, athletes]
    defaults:
      run:
        working-directory: frontend/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PROFILE: ${{ matrix.app }}-${{ inputs.target == 'staging' && 'demo' || 'preview' }}
    steps:
      - name: Check the Expo token
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret (expo.dev → Access tokens) and run again."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm install -g eas-cli
      - name: Build ${{ env.PROFILE }} APK on this runner
        run: |
          eas build --platform android --profile "$PROFILE" --local --non-interactive \
            --output "$GITHUB_WORKSPACE/aura-$PROFILE.apk"
          ls -la "$GITHUB_WORKSPACE/aura-$PROFILE.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: aura-${{ env.PROFILE }}-apk
          path: ${{ github.workspace }}/aura-${{ env.PROFILE }}.apk
          retention-days: 30
