name: Build Android AAB (local EAS build)

# Builds the Play Store bundle on the GitHub runner with `eas build --local`, which does not use
# the EAS cloud build quota. Signing keys come from EAS (remote credentials).
#
# Needs one repository secret: EXPO_TOKEN (expo.dev -> account ganesh_a_k_11 -> Access tokens).
# Run: Actions -> "Build Android AAB" -> Run workflow. The .aab is attached as an artifact.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: App to build
        type: choice
        options: [athletes, officials]
        default: athletes

jobs:
  build:
    if: github.repository == 'ganeshak11/vtu-athletics'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm install -g eas-cli
      - name: Build AAB
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: '1'
        run: |
          eas build --local --non-interactive --platform android \
            --profile ${{ inputs.variant }}-production \
            --output "$GITHUB_WORKSPACE/${{ inputs.variant }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: aura-${{ inputs.variant }}-aab
          path: ${{ github.workspace }}/${{ inputs.variant }}.aab
          retention-days: 14
