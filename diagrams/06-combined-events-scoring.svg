<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500"><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16224a"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2456c8"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98b00"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d8a4e"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker></defs><rect width="1400" height="500" fill="#ffffff"/><text x="30" y="42" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#16224a" text-anchor="start">Decathlon and heptathlon - how a mark becomes a place</text><text x="30" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5b6475" text-anchor="start">World Athletics 1985 tables. The server is the only thing that decides points; the app only previews them while typing.</text><rect x="30" y="100" width="240" height="120" rx="10" fill="#fff4d6" stroke="#c98b00" stroke-width="2"/><text x="150.0" y="124" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#c98b00" text-anchor="middle">1. Referee types a mark</text><text x="150.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Officials app, discipline tab</text><text x="150.0" y="163" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">e.g. 100m 10.39  or</text><text x="150.0" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Long jump 7.76 m</text><rect x="310" y="100" width="260" height="120" rx="10" fill="#e8ecf8" stroke="#16224a" stroke-width="2"/><text x="440.0" y="124" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#16224a" text-anchor="middle">2. API checks</text><text x="440.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">POST /api/combined/result</text><text x="440.0" y="163" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">call room closed? athlete</text><text x="440.0" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">reported? event assigned to</text><text x="440.0" y="197" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">this referee? heat not final?</text><rect x="610" y="100" width="270" height="120" rx="10" fill="#e2f6ea" stroke="#1d8a4e" stroke-width="2"/><text x="745.0" y="124" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1d8a4e" text-anchor="middle">3. Database scores it</text><text x="745.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">range check (impossible marks</text><text x="745.0" y="163" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">refused), round: times up,</text><text x="745.0" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">field down; points =</text><text x="745.0" y="197" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">floor(A x (B-P)^C)</text><rect x="920" y="100" width="220" height="120" rx="10" fill="#e2f6ea" stroke="#1d8a4e" stroke-width="2"/><text x="1030.0" y="124" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1d8a4e" text-anchor="middle">4. Stored</text><text x="1030.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">combined_results row:</text><text x="1030.0" y="163" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">mark, status, points</text><rect x="1180" y="100" width="190" height="120" rx="10" fill="#e4edff" stroke="#2456c8" stroke-width="2"/><text x="1275.0" y="124" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2456c8" text-anchor="middle">5. Live total</text><text x="1275.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Totals and ranks</text><text x="1275.0" y="163" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">refresh in the app</text><line x1="270" y1="160" x2="310" y2="160" stroke="#16224a" stroke-width="2.2" marker-end="url(#a0)"/><line x1="570" y1="160" x2="610" y2="160" stroke="#16224a" stroke-width="2.2" marker-end="url(#a0)"/><line x1="880" y1="160" x2="920" y2="160" stroke="#16224a" stroke-width="2.2" marker-end="url(#a0)"/><line x1="1140" y1="160" x2="1180" y2="160" stroke="#16224a" stroke-width="2.2" marker-end="url(#a0)"/><rect x="30" y="290" width="640" height="190" rx="10" fill="#e4edff" stroke="#2456c8" stroke-width="2"/><text x="350.0" y="314" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2456c8" text-anchor="middle">Track formula   points = floor( A x (B - P) ^ C )</text><text x="350.0" y="336" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">P = time in seconds. Faster time = more points.</text><text x="350.0" y="353" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">Field formula  points = floor( A x (P - B) ^ C )</text><text x="350.0" y="370" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">P = cm for jumps (LJ, HJ, PV) and metres for throws.</text><text x="350.0" y="387" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">Worse than B scores 0.</text><text x="350.0" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle"></text><text x="350.0" y="421" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">Example: 100 m in 10.39 s -&gt; 1001 points (A 25.4347, B 18, C 1.81)</text><text x="350.0" y="438" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">Example: 7.76 m long jump -&gt; 1000 points</text><rect x="710" y="290" width="660" height="190" rx="10" fill="#e2f6ea" stroke="#1d8a4e" stroke-width="2"/><text x="1040.0" y="314" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1d8a4e" text-anchor="middle">Ranking and championship points</text><text x="1040.0" y="336" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">Classified = a result in EVERY discipline, none DNS / DNF / DQ.</text><text x="1040.0" y="353" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">NM (no valid mark) scores 0 and the athlete stays in.</text><text x="1040.0" y="370" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">Order: highest total; equal totals -&gt; more disciplines with</text><text x="1040.0" y="387" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">the higher score wins; still equal -&gt; shared place.</text><text x="1040.0" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">Finalize -&gt; places 1-3: college 10 / 6 / 2, athlete 5 / 3 / 1,</text><text x="1040.0" y="421" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">feeding the Men / Women / Overall championship.</text><text x="1040.0" y="438" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">A mark edited later recalculates places and points.</text></svg>