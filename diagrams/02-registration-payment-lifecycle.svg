<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640"><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16224a"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2456c8"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98b00"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d8a4e"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker></defs><rect width="1400" height="640" fill="#ffffff"/><text x="30" y="42" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#16224a" text-anchor="start">Before the meet - registration, payment and accreditation lifecycle</text><text x="30" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5b6475" text-anchor="start">Owned by the college PED (contingent manager), checked by the finance desk and meet admin.</text><rect x="30" y="110" width="250" height="150" rx="10" fill="#e8ecf8" stroke="#16224a" stroke-width="2"/><text x="155.0" y="134" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#16224a" text-anchor="middle">1. Admin creates college</text><text x="155.0" y="156" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Admin adds college;</text><text x="155.0" y="173" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">system makes a Men and a</text><text x="155.0" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Women squad, each with a</text><text x="155.0" y="207" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">squad code + passphrase</text><line x1="280" y1="185" x2="300" y2="185" stroke="#16224a" stroke-width="2.2" marker-end="url(#a0)"/><rect x="300" y="110" width="250" height="150" rx="10" fill="#e4edff" stroke="#2456c8" stroke-width="2"/><text x="425.0" y="134" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2456c8" text-anchor="middle">2. PED logs in</text><text x="425.0" y="156" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">/login/squad</text><text x="425.0" y="173" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">squad code + passphrase</text><text x="425.0" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">(one login per squad)</text><line x1="550" y1="185" x2="570" y2="185" stroke="#2456c8" stroke-width="2.2" marker-end="url(#a1)"/><rect x="570" y="110" width="250" height="150" rx="10" fill="#e4edff" stroke="#2456c8" stroke-width="2"/><text x="695.0" y="134" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2456c8" text-anchor="middle">3. Add athletes</text><text x="695.0" y="156" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Name, USN, semester, blood</text><text x="695.0" y="173" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">group, Aadhaar, DOB, dates,</text><text x="695.0" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">passport photo, up to 2 events</text><text x="695.0" y="207" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">+ 1 reserve + relay ticks</text><line x1="820" y1="185" x2="840" y2="185" stroke="#2456c8" stroke-width="2.2" marker-end="url(#a1)"/><rect x="840" y="110" width="250" height="150" rx="10" fill="#fff4d6" stroke="#c98b00" stroke-width="2"/><text x="965.0" y="134" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c98b00" text-anchor="middle">4. Fee is computed</text><text x="965.0" y="156" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Rs 100 per entry, reserve free,</text><text x="965.0" y="173" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">relay Rs 100 x first 4 members,</text><text x="965.0" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">one fee account per college</text><text x="965.0" y="207" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">(Men + Women together)</text><line x1="1090" y1="185" x2="1110" y2="185" stroke="#c98b00" stroke-width="2.2" marker-end="url(#a2)"/><rect x="1110" y="110" width="250" height="150" rx="10" fill="#fff4d6" stroke="#c98b00" stroke-width="2"/><text x="1235.0" y="134" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c98b00" text-anchor="middle">5. PED pays and submits</text><text x="1235.0" y="156" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Pays by UPI, then enters UTR</text><text x="1235.0" y="173" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">+ amount + receipt screenshot.</text><text x="1235.0" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Roster locks automatically</text><text x="1235.0" y="207" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">for BOTH squads</text><rect x="30" y="330" width="250" height="150" rx="10" fill="#e2f6ea" stroke="#1d8a4e" stroke-width="2"/><text x="155.0" y="354" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d8a4e" text-anchor="middle">6. Finance verifies</text><text x="155.0" y="376" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Finance desk checks the UTR</text><text x="155.0" y="393" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">against the bank.</text><text x="155.0" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">VERIFIED or REJECTED</text><text x="155.0" y="427" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">with a reason</text><line x1="280" y1="405" x2="300" y2="405" stroke="#1d8a4e" stroke-width="2.2" marker-end="url(#a3)"/><rect x="300" y="330" width="250" height="150" rx="10" fill="#e8ecf8" stroke="#16224a" stroke-width="2"/><text x="425.0" y="354" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#16224a" text-anchor="middle">7. Registration closes</text><text x="425.0" y="376" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Admin closes registration.</text><text x="425.0" y="393" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Contiguous bib numbers are</text><text x="425.0" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">generated for every athlete</text><text x="425.0" y="427" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">(bibs never change)</text><line x1="550" y1="405" x2="570" y2="405" stroke="#16224a" stroke-width="2.2" marker-end="url(#a0)"/><rect x="570" y="330" width="250" height="150" rx="10" fill="#e8ecf8" stroke="#16224a" stroke-width="2"/><text x="695.0" y="354" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#16224a" text-anchor="middle">8. ID cards / delegations</text><text x="695.0" y="376" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Admin prints ID cards,</text><text x="695.0" y="393" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">delegation sheets and</text><text x="695.0" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">certificates from verified,</text><text x="695.0" y="427" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">locked rosters</text><line x1="820" y1="405" x2="840" y2="405" stroke="#16224a" stroke-width="2.2" marker-end="url(#a0)"/><rect x="840" y="330" width="250" height="150" rx="10" fill="#fff4d6" stroke="#c98b00" stroke-width="2"/><text x="965.0" y="354" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c98b00" text-anchor="middle">9. Arrival: accreditation</text><text x="965.0" y="376" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Officials app scan at the desk.</text><text x="965.0" y="393" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Only athletes of colleges with</text><text x="965.0" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">VERIFIED payment can be</text><text x="965.0" y="427" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">accredited</text><line x1="1090" y1="405" x2="1110" y2="405" stroke="#c98b00" stroke-width="2.2" marker-end="url(#a2)"/><rect x="1110" y="330" width="250" height="150" rx="10" fill="#f0e8fa" stroke="#6b3fa0" stroke-width="2"/><text x="1235.0" y="354" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#6b3fa0" text-anchor="middle">10. Heat draw needs both</text><text x="1235.0" y="376" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Only ACCREDITED athletes of</text><text x="1235.0" y="393" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">VERIFIED colleges are drawn</text><text x="1235.0" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">into heats, teammates in</text><text x="1235.0" y="427" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">different heats</text><line x1="1200" y1="260" x2="160" y2="330" stroke="#c98b00" stroke-width="2.2" marker-end="url(#a2)"/><text x="700" y="285" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#c98b00" text-anchor="middle">submitted payment goes to the finance queue</text><rect x="30" y="520" width="1340" height="95" rx="14" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-dasharray="3 5"/><text x="44" y="540" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#5b6475" text-anchor="start">RULES THE SYSTEM ENFORCES (cannot be bypassed from the app)</text><text x="50" y="560" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="start">Max 2 individual events + 1 reserve per athlete  |  max 2 athletes per college per event  |  only one divisional relay (4x100 or 4x400)  |  Aadhaar and USN unique across the meet</text><text x="50" y="585" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="start">Locked rosters cannot be edited (only admin can unlock for an emergency)  |  photo mandatory (JPG/PNG/WebP up to 5 MB)  |  UTR unique  |  every change is audit-logged</text></svg>