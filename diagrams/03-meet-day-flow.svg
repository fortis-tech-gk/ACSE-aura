<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16224a"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2456c8"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98b00"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d8a4e"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker></defs><rect width="1400" height="760" fill="#ffffff"/><text x="30" y="42" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#16224a" text-anchor="start">Meet day - from arrival to the leaderboard</text><text x="30" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5b6475" text-anchor="start">Every scan and result is a call from the Officials app to the API. Results appear on the website and in the Athletes app as soon as a heat is finalized.</text><rect x="30" y="100" width="250" height="130" rx="10" fill="#fff4d6" stroke="#c98b00" stroke-width="2"/><text x="155.0" y="124" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#c98b00" text-anchor="middle">Arrival</text><text x="155.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Accreditation desk scans</text><text x="155.0" y="163" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">the athlete QR / bib.</text><text x="155.0" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Status: REGISTERED -&gt;</text><text x="155.0" y="197" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">ACCREDITED</text><rect x="310" y="100" width="250" height="130" rx="10" fill="#fff4d6" stroke="#c98b00" stroke-width="2"/><text x="435.0" y="124" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#c98b00" text-anchor="middle">Hostel and food</text><text x="435.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Warden scans check-in</text><text x="435.0" y="163" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">(hostel + room).</text><text x="435.0" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Food counter scans each</text><text x="435.0" y="197" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">meal (one per meal slot)</text><rect x="590" y="100" width="250" height="130" rx="10" fill="#e8ecf8" stroke="#16224a" stroke-width="2"/><text x="715.0" y="124" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#16224a" text-anchor="middle">Heat draw (admin)</text><text x="715.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Admin draws heats per event:</text><text x="715.0" y="163" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">lanes seeded fairly,</text><text x="715.0" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">teammates split,</text><text x="715.0" y="197" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">schedule linked</text><rect x="870" y="100" width="250" height="130" rx="10" fill="#fff4d6" stroke="#c98b00" stroke-width="2"/><text x="995.0" y="124" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#c98b00" text-anchor="middle">Call room opens</text><text x="995.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Call room official scans</text><text x="995.0" y="163" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">each athlete: spikes, bib,</text><text x="995.0" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">reserve swaps, scratches.</text><text x="995.0" y="197" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Not reported = DNS</text><rect x="1150" y="100" width="220" height="130" rx="10" fill="#fff4d6" stroke="#c98b00" stroke-width="2"/><text x="1260.0" y="124" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#c98b00" text-anchor="middle">Call room closes</text><text x="1260.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Heat goes to the track.</text><text x="1260.0" y="163" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Late scans refused.</text><text x="1260.0" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Results can now be</text><text x="1260.0" y="197" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">entered</text><line x1="280" y1="165" x2="310" y2="165" stroke="#16224a" stroke-width="2.2" marker-end="url(#a0)"/><line x1="560" y1="165" x2="590" y2="165" stroke="#16224a" stroke-width="2.2" marker-end="url(#a0)"/><line x1="840" y1="165" x2="870" y2="165" stroke="#16224a" stroke-width="2.2" marker-end="url(#a0)"/><line x1="1120" y1="165" x2="1150" y2="165" stroke="#16224a" stroke-width="2.2" marker-end="url(#a0)"/><rect x="30" y="300" width="300" height="160" rx="10" fill="#fff4d6" stroke="#c98b00" stroke-width="2"/><text x="180.0" y="324" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#c98b00" text-anchor="middle">Referee - track</text><text x="180.0" y="346" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Time per lane or DNF/DQ/DNS.</text><text x="180.0" y="363" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Places fill in, ties shared.</text><text x="180.0" y="380" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Finalize: top 2 of each heat</text><text x="180.0" y="397" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">qualify, next round auto-drawn</text><rect x="360" y="300" width="300" height="160" rx="10" fill="#fff4d6" stroke="#c98b00" stroke-width="2"/><text x="510.0" y="324" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#c98b00" text-anchor="middle">Referee - field / vertical</text><text x="510.0" y="346" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Throws &amp; jumps: 6 trials,</text><text x="510.0" y="363" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">best valid mark, countback.</text><text x="510.0" y="380" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">High jump / pole vault:</text><text x="510.0" y="397" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">O / X / - per bar height</text><rect x="690" y="300" width="300" height="160" rx="10" fill="#fff4d6" stroke="#c98b00" stroke-width="2"/><text x="840.0" y="324" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#c98b00" text-anchor="middle">Referee - decathlon / hepta</text><text x="840.0" y="346" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Pick discipline, type marks.</text><text x="840.0" y="363" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Server converts to World</text><text x="840.0" y="380" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Athletics points, running</text><text x="840.0" y="397" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">total + tie-break ranking</text><rect x="1020" y="300" width="350" height="160" rx="10" fill="#e2f6ea" stroke="#1d8a4e" stroke-width="2"/><text x="1195.0" y="324" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1d8a4e" text-anchor="middle">Finalize the heat</text><text x="1195.0" y="346" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Heat marked COMPLETED.</text><text x="1195.0" y="363" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">FINAL / combined event:</text><text x="1195.0" y="380" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">places 1-3 score: college</text><text x="1195.0" y="397" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">10 / 6 / 2, athlete 5 / 3 / 1</text><line x1="1250" y1="230" x2="1250" y2="300" stroke="#c98b00" stroke-width="2.2" marker-end="url(#a2)"/><text x="1305" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#c98b00" text-anchor="middle">results enabled</text><line x1="990" y1="380" x2="1020" y2="380" stroke="#1d8a4e" stroke-width="2.2" marker-end="url(#a3)"/><text x="345" y="482" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#c98b00" text-anchor="middle">one referee screen per event type</text><text x="675" y="482" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#c98b00" text-anchor="middle">each ends with Finalize</text><rect x="30" y="520" width="1340" height="210" rx="14" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-dasharray="3 5"/><text x="44" y="540" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#5b6475" text-anchor="start">WHAT EVERYONE SEES NEXT (caches cleared the instant a heat is finalized)</text><rect x="60" y="560" width="300" height="140" rx="10" fill="#e4edff" stroke="#2456c8" stroke-width="2"/><text x="210.0" y="584" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2456c8" text-anchor="middle">Public website /results</text><text x="210.0" y="606" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Live results (refresh 15 s),</text><text x="210.0" y="623" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">medal rows, team standings:</text><text x="210.0" y="640" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Overall, Men, Women</text><rect x="390" y="560" width="300" height="140" rx="10" fill="#e2f6ea" stroke="#1d8a4e" stroke-width="2"/><text x="540.0" y="584" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1d8a4e" text-anchor="middle">Athletes app</text><text x="540.0" y="606" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">My Pass, my events, place in</text><text x="540.0" y="623" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">heat, medals + points,</text><text x="540.0" y="640" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">college rank, push alerts</text><text x="540.0" y="657" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">(&quot;you qualified&quot;)</text><rect x="720" y="560" width="300" height="140" rx="10" fill="#e8ecf8" stroke="#16224a" stroke-width="2"/><text x="870.0" y="584" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#16224a" text-anchor="middle">Admin</text><text x="870.0" y="606" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Heats, score sheets,</text><text x="870.0" y="623" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">audit log of every result</text><text x="870.0" y="640" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">change, amendments,</text><text x="870.0" y="657" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">certificates</text><rect x="1050" y="560" width="290" height="140" rx="10" fill="#f0e8fa" stroke="#6b3fa0" stroke-width="2"/><text x="1195.0" y="584" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#6b3fa0" text-anchor="middle">Leaderboard</text><text x="1195.0" y="606" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">team_points table feeds the</text><text x="1195.0" y="623" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Overall / Men / Women</text><text x="1195.0" y="640" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">standings and medal tally</text><line x1="1250" y1="460" x2="1250" y2="520" stroke="#1d8a4e" stroke-width="2.2" marker-end="url(#a3)"/></svg>