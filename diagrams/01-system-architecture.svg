<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16224a"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2456c8"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98b00"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d8a4e"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker></defs><rect width="1400" height="900" fill="#ffffff"/><text x="30" y="42" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#16224a" text-anchor="start">VTU SportsOS (Dr. ACS-AURA 2026) - System architecture</text><text x="30" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5b6475" text-anchor="start">Who talks to what. Solid arrows = HTTPS requests. Staging and production are two separate copies of the same stack.</text><rect x="20" y="90" width="1360" height="150" rx="14" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-dasharray="3 5"/><text x="34" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#5b6475" text-anchor="start">PEOPLE AND THEIR DEVICES</text><rect x="40" y="120" width="240" height="100" rx="10" fill="#e4edff" stroke="#2456c8" stroke-width="2"/><text x="160.0" y="144" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2456c8" text-anchor="middle">College PED / contingent</text><text x="160.0" y="166" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Browser (phone or laptop)</text><text x="160.0" y="183" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">register athletes, pay fees</text><rect x="300" y="120" width="260" height="100" rx="10" fill="#e8ecf8" stroke="#16224a" stroke-width="2"/><text x="430.0" y="144" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#16224a" text-anchor="middle">Admin / Finance / Reg desk</text><text x="430.0" y="166" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Browser</text><text x="430.0" y="183" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">verify payments, run the meet</text><rect x="580" y="120" width="240" height="100" rx="10" fill="#eef0f4" stroke="#5b6475" stroke-width="2"/><text x="700.0" y="144" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#5b6475" text-anchor="middle">Public / spectators</text><text x="700.0" y="166" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Browser</text><text x="700.0" y="183" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">live results, no login</text><rect x="840" y="120" width="240" height="100" rx="10" fill="#e2f6ea" stroke="#1d8a4e" stroke-width="2"/><text x="960.0" y="144" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1d8a4e" text-anchor="middle">Athletes</text><text x="960.0" y="166" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">AURA Athletes app (Android/iOS)</text><text x="960.0" y="183" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">pass, events, results</text><rect x="1100" y="120" width="260" height="100" rx="10" fill="#fff4d6" stroke="#c98b00" stroke-width="2"/><text x="1230.0" y="144" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#c98b00" text-anchor="middle">Officials</text><text x="1230.0" y="166" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">AURA Officials app (Android)</text><text x="1230.0" y="183" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">scan, call room, referee</text><rect x="20" y="290" width="1360" height="270" rx="14" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-dasharray="3 5"/><text x="34" y="310" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#5b6475" text-anchor="start">APPLICATION LAYER</text><rect x="60" y="330" width="520" height="200" rx="10" fill="#e4edff" stroke="#2456c8" stroke-width="2"/><text x="320.0" y="354" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2456c8" text-anchor="middle">WEBSITE  -  Next.js 16 on Vercel</text><text x="320.0" y="376" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Pages: /squad (PED portal), /admin, /registration-desk, /results</text><text x="320.0" y="393" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Server components + server actions (code runs on the server,</text><text x="320.0" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">never in the browser)</text><text x="320.0" y="427" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Rules enforced here: quotas, uniqueness, DOB, photo,</text><text x="320.0" y="444" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">roster lock, fee calculation, payment submission</text><text x="320.0" y="461" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Auth: squad code + passphrase, admin/finance login (cookie sessions)</text><rect x="700" y="330" width="620" height="200" rx="10" fill="#fff4d6" stroke="#c98b00" stroke-width="2"/><text x="1010.0" y="354" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#c98b00" text-anchor="middle">API  -  Node.js + Express on Google Cloud Run (Mumbai)</text><text x="1010.0" y="376" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Used by the two mobile apps (and live results)</text><text x="1010.0" y="393" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">/athlete  /officials  /accreditation  /accommodation  /catering</text><text x="1010.0" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">/callroom  /track  /field  /combined  /schedule  /leaderboard  /live</text><text x="1010.0" y="427" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Auth: JWT. Athlete = bib + date of birth. Officials = duty + PIN.</text><text x="1010.0" y="444" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Rate limits, helmet, CORS. Event scope: a referee only writes</text><text x="1010.0" y="461" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">the events assigned to them.</text><rect x="20" y="610" width="1360" height="250" rx="14" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-dasharray="3 5"/><text x="34" y="630" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#5b6475" text-anchor="start">DATA AND SERVICES</text><rect x="60" y="650" width="640" height="190" rx="10" fill="#e2f6ea" stroke="#1d8a4e" stroke-width="2"/><text x="380.0" y="674" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1d8a4e" text-anchor="middle">SUPABASE  -  PostgreSQL (Mumbai, Pro plan)</text><text x="380.0" y="696" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Tables: colleges, squads, profiles, registrations, payments, events,</text><text x="380.0" y="713" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">heats, heat_athletes, track_results, field_attempts, combined_results,</text><text x="380.0" y="730" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">team_points, staff, schedule, hostels, meal_logs ...</text><text x="380.0" y="747" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">SQL functions do the heavy rules: heat draw, ranking, tie-breaks,</text><text x="380.0" y="764" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">World Athletics decathlon points, championship points.</text><text x="380.0" y="781" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Row-level security ON: the public keys can read nothing.</text><rect x="740" y="650" width="290" height="190" rx="10" fill="#f0e8fa" stroke="#6b3fa0" stroke-width="2"/><text x="885.0" y="674" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#6b3fa0" text-anchor="middle">Storage buckets (in Supabase)</text><text x="885.0" y="696" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">athlete-photos (PRIVATE:</text><text x="885.0" y="713" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">served by expiring signed links)</text><text x="885.0" y="730" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">payment-proofs</text><text x="885.0" y="747" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">(UPI receipts, JPG/PNG/PDF)</text><rect x="1060" y="650" width="300" height="190" rx="10" fill="#eef0f4" stroke="#5b6475" stroke-width="2"/><text x="1210.0" y="674" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#5b6475" text-anchor="middle">Other services</text><text x="1210.0" y="696" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Expo Push: &quot;you are through to</text><text x="1210.0" y="713" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">the final&quot; notifications</text><text x="1210.0" y="730" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">Cloud Run Secret Manager</text><text x="1210.0" y="747" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">UPI (bank, outside the system:</text><text x="1210.0" y="764" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#333" text-anchor="middle">PED pays, finance verifies)</text><line x1="230" y1="220" x2="230" y2="330" stroke="#2456c8" stroke-width="2.2" marker-end="url(#a1)"/><text x="262" y="269.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#2456c8" text-anchor="middle">HTTPS</text><line x1="430" y1="220" x2="330" y2="330" stroke="#16224a" stroke-width="2.2" marker-end="url(#a0)"/><text x="380.0" y="269.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#16224a" text-anchor="middle">HTTPS</text><line x1="700" y1="220" x2="480" y2="330" stroke="#5b6475" stroke-width="2.2" marker-end="url(#a6)"/><text x="590.0" y="269.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5b6475" text-anchor="middle">HTTPS</text><line x1="960" y1="220" x2="960" y2="330" stroke="#1d8a4e" stroke-width="2.2" marker-end="url(#a3)"/><text x="1020" y="269.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1d8a4e" text-anchor="middle">HTTPS + JWT</text><line x1="1230" y1="220" x2="1230" y2="330" stroke="#c98b00" stroke-width="2.2" marker-end="url(#a2)"/><text x="1295" y="269.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#c98b00" text-anchor="middle">HTTPS + JWT</text><line x1="320" y1="530" x2="320" y2="650" stroke="#2456c8" stroke-width="2.2" marker-end="url(#a1)"/><text x="420" y="584.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#2456c8" text-anchor="middle">server-side, service key</text><line x1="1010" y1="530" x2="560" y2="650" stroke="#c98b00" stroke-width="2.2" marker-end="url(#a2)"/><text x="820" y="600" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#c98b00" text-anchor="middle">service key</text><line x1="1150" y1="530" x2="1200" y2="650" stroke="#5b6475" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a6)"/><text x="1200" y="590" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#5b6475" text-anchor="middle">push</text></svg>