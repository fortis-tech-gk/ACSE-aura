<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610"><defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16224a"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2456c8"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98b00"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d8a4e"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker></defs><rect width="1400" height="610" fill="#ffffff"/><text x="30" y="42" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#16224a" text-anchor="start">Who does what - access by role</text><text x="30" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5b6475" text-anchor="start">Four kinds of people use the system. Each has their own login and sees only what they need.</text><rect x="30" y="100" width="325" height="480" rx="12" fill="#e4edff" stroke="#2456c8" stroke-width="2"/><text x="192" y="130" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2456c8" text-anchor="middle">COLLEGE PED (contingent manager)</text><text x="48" y="165" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">Login: squad code + passphrase</text><text x="48" y="190" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">Website: /squad</text><text x="48" y="215" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start"></text><text x="48" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Register athletes + photos</text><text x="48" y="265" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Pick events, reserve, relays</text><text x="48" y="290" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">See fees, pay by UPI + UTR</text><text x="48" y="315" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Download entry report,</text><text x="48" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">  attendance certificate</text><text x="48" y="365" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">See bibs after registration</text><text x="48" y="390" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">closes</text><text x="48" y="415" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start"></text><text x="48" y="440" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Cannot: edit after payment</text><text x="48" y="465" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">submitted, see other colleges</text><rect x="372" y="100" width="325" height="480" rx="12" fill="#e2f6ea" stroke="#1d8a4e" stroke-width="2"/><text x="534" y="130" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d8a4e" text-anchor="middle">ATHLETE</text><text x="390" y="165" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">Login: bib + date of birth</text><text x="390" y="190" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">AURA Athletes app</text><text x="390" y="215" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start"></text><text x="390" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">My Pass: QR for scanning</text><text x="390" y="265" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Events: schedule + call</text><text x="390" y="290" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">room reminders</text><text x="390" y="315" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Results: time / mark, place,</text><text x="390" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">medals, points, college rank</text><text x="390" y="365" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Stay and Meals: hostel, room,</text><text x="390" y="390" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">meals used today</text><text x="390" y="415" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Directions to venue, push</text><text x="390" y="440" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">notifications</text><text x="390" y="465" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start"></text><text x="390" y="490" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Cannot: change anything</text><rect x="714" y="100" width="325" height="480" rx="12" fill="#fff4d6" stroke="#c98b00" stroke-width="2"/><text x="876" y="130" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#c98b00" text-anchor="middle">OFFICIALS</text><text x="732" y="165" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">Login: duty + 6 digit PIN</text><text x="732" y="190" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">AURA Officials app</text><text x="732" y="215" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start"></text><text x="732" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Accreditation desk: scan QR</text><text x="732" y="265" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Hostel warden: check-in</text><text x="732" y="290" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Food counter: meal scan</text><text x="732" y="315" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Call room: check athletes in,</text><text x="732" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">scratches, reserve/relay swap</text><text x="732" y="365" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Referee: times, distances,</text><text x="732" y="390" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">heights, decathlon marks,</text><text x="732" y="415" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">finalize heat</text><text x="732" y="440" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start"></text><text x="732" y="465" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Works offline: results queue</text><text x="732" y="490" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">on the tablet and sync later</text><rect x="1056" y="100" width="325" height="480" rx="12" fill="#e8ecf8" stroke="#16224a" stroke-width="2"/><text x="1218" y="130" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#16224a" text-anchor="middle">ADMIN / FINANCE / REG DESK</text><text x="1074" y="165" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">Login: username + password</text><text x="1074" y="190" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="start">Website: /admin</text><text x="1074" y="215" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start"></text><text x="1074" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Colleges and squads, staff</text><text x="1074" y="265" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Payments: verify UTRs (finance</text><text x="1074" y="290" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">desk sees ONLY this page)</text><text x="1074" y="315" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Close registration, bibs, ID</text><text x="1074" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">cards, delegations, certificates</text><text x="1074" y="365" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Heat draw and schedule</text><text x="1074" y="390" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Amendments (withdraw /</text><text x="1074" y="415" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">substitute), roster unlock</text><text x="1074" y="440" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Audit log, score sheets</text><text x="1074" y="465" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">Registration desk: mark college</text><text x="1074" y="490" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start">attendance on arrival</text></svg>